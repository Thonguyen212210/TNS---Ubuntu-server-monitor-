<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>TNS Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a73e8'/%3E%3Crect x='7' y='8' width='18' height='4' fill='%23fff'/%3E%3Crect x='14' y='12' width='4' height='13' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- auth screen -->
<div id="auth" class="auth hidden">
  <div class="auth-wrap">
    <div class="auth-brand"><span class="logo-box">TNS</span><span class="auth-brand-t">Server Console</span></div>
    <div class="auth-card card">
      <h1 class="auth-title" id="authTitle">Đăng nhập</h1>
      <p class="auth-host" id="authHost">—</p>
      <form id="authForm" autocomplete="off">
        <p class="auth-hint" id="authHint"></p>
        <label class="field"><span>Mật khẩu</span>
          <input type="password" id="pw1" autocomplete="current-password" required></label>
        <label class="field hidden" id="pw2wrap"><span>Nhập lại mật khẩu</span>
          <input type="password" id="pw2" autocomplete="new-password"></label>
        <div class="strength hidden" id="strength"><i></i></div>
        <div class="pw-tools">
          <label><input type="checkbox" id="pwShow"> Hiện mật khẩu</label>
          <span class="mono" id="pwCount"></span>
        </div>
        <div class="auth-err" id="authErr"></div>
        <button class="btn primary wide" id="authBtn" type="submit">Đăng nhập</button>
      </form>
    </div>
  </div>
</div>

<!-- app shell -->
<div id="app" class="hidden">
  <header class="topbar">
    <button class="tb-btn menu-btn" id="menuBtn" title="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
    <a class="tb-brand" href="#/dashboard"><span class="logo-box">TNS</span><span class="tb-brand-t">Server Console</span></a>
    <span class="tb-host"><svg class="ico sm"><use href="#i-server"/></svg><b id="tbHost">—</b></span>
    <span class="badge demo hidden" id="demoBadge">DEMO</span>
    <span class="tb-sp"></span>
    <span class="tb-stat mono hide-sm" id="tbLive">CPU — · RAM —</span>
    <span class="tb-stat mono hide-sm" id="tbUp">Uptime —</span>
    <span class="tb-stat mono hide-xs" id="tbClock">--:--:--</span>
    <button class="tb-btn" id="themeBtn" title="Đổi giao diện sáng / tối"><svg class="ico"><use href="#i-theme"/></svg></button>
    <button class="tb-btn" id="logoutBtn" title="Đăng xuất"><svg class="ico"><use href="#i-logout"/></svg><span class="hide-sm">Đăng xuất</span></button>
  </header>
  <div class="shell">
    <aside class="nav"><nav id="navList"></nav></aside>
    <div class="nav-scrim" id="navScrim"></div>
    <main class="main">
      <div class="page-head">
        <div class="crumbs-top"><a href="#/dashboard">TNS</a><span>›</span><span id="crumbCur">—</span></div>
        <h1 id="pageTitle">—</h1>
        <p id="pageSub"></p>
      </div>
      <section id="view" class="view"></section>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts"></div>
