<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f243e">
<title>Azure Cloud Console</title>

<link rel="stylesheet" href="app.css?v=1.2.1">
</head>
<body>
<!-- auth screen -->
<div id="auth" class="auth hidden">
  <div class="auth-wrap">
    <div class="auth-brand">
      <svg class="az-logo lg" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="azA1" x1="40" y1="10" x2="18" y2="86" gradientUnits="userSpaceOnUse"><stop stop-color="#114A8B"/><stop offset="1" stop-color="#0669BC"/></linearGradient>
          <linearGradient id="azA2" x1="47" y1="10" x2="72" y2="85" gradientUnits="userSpaceOnUse"><stop stop-color="#3CCBF4"/><stop offset="1" stop-color="#2892DF"/></linearGradient>
        </defs>
        <path fill="url(#azA1)" d="M33.3 6.5h26.1L32.3 86.7a4.1 4.1 0 01-3.9 2.8H8.1a4.1 4.1 0 01-3.9-5.5L29.4 9.3a4.1 4.1 0 013.9-2.8z"/>
        <path fill="#0078D4" d="M71.2 60.3H29.9a1.9 1.9 0 00-1.3 3.3l26.5 24.8a4.2 4.2 0 002.9 1.1h23.4z"/>
        <path fill="url(#azA2)" d="M66.6 9.3a4.1 4.1 0 00-3.9-2.8H33.6a4.1 4.1 0 013.9 2.8l25.2 74.7a4.1 4.1 0 01-3.9 5.5h29.1a4.1 4.1 0 003.9-5.5z"/>
      </svg>
      <div class="auth-brand-stack">
        <span class="auth-brand-t">Microsoft Azure</span>
        <span class="auth-brand-s">Cloud Infrastructure &amp; VM Console</span>
      </div>
    </div>
    <div class="auth-card card">
      <h1 class="auth-title" id="authTitle">Sign in</h1>
      <p class="auth-host" id="authHost">—</p>
      <div id="pkLoginBox" class="hidden" style="margin-bottom:14px">
        <button class="btn primary wide" id="pkLoginBtn" type="button"><svg class="ico"><use href="#i-key"/></svg>Sign in with Passkey</button>
        <div class="auth-div" id="pkDiv"><span>or use password</span></div>
      </div>
      <form id="authForm" autocomplete="off">
        <p class="auth-hint" id="authHint"></p>
        <label class="field hidden" id="tokWrap"><span>Setup token</span>
          <input id="setupTok" class="mono" autocomplete="off" spellcheck="false" placeholder="XXXXXX-XXXXXX-XXXXXX"></label>
        <label class="field"><span>Password</span>
          <input type="password" id="pw1" autocomplete="current-password" required></label>
        <label class="field hidden" id="pw2wrap"><span>Confirm password</span>
          <input type="password" id="pw2" autocomplete="new-password"></label>
        <div class="strength hidden" id="strength"><i></i></div>
        <div class="pw-tools">
          <label><input type="checkbox" id="pwShow"> Show password</label>
          <span class="mono" id="pwCount"></span>
        </div>
        <button class="btn primary wide" id="authBtn" type="submit">Sign in</button>
      </form>
      <div class="auth-err" id="authErr" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<!-- app shell -->
<div id="app" class="hidden">
  <header class="topbar">
    <button class="tb-btn menu-btn" id="menuBtn" title="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
    <a class="tb-brand" href="#/azure">
      <svg class="az-logo" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="azT1" x1="40" y1="10" x2="18" y2="86" gradientUnits="userSpaceOnUse"><stop stop-color="#1E88E5"/><stop offset="1" stop-color="#0078D4"/></linearGradient>
          <linearGradient id="azT2" x1="47" y1="10" x2="72" y2="85" gradientUnits="userSpaceOnUse"><stop stop-color="#50E6FF"/><stop offset="1" stop-color="#2892DF"/></linearGradient>
        </defs>
        <path fill="url(#azT1)" d="M33.3 6.5h26.1L32.3 86.7a4.1 4.1 0 01-3.9 2.8H8.1a4.1 4.1 0 01-3.9-5.5L29.4 9.3a4.1 4.1 0 013.9-2.8z"/>
        <path fill="#0078D4" d="M71.2 60.3H29.9a1.9 1.9 0 00-1.3 3.3l26.5 24.8a4.2 4.2 0 002.9 1.1h23.4z"/>
        <path fill="url(#azT2)" d="M66.6 9.3a4.1 4.1 0 00-3.9-2.8H33.6a4.1 4.1 0 013.9 2.8l25.2 74.7a4.1 4.1 0 01-3.9 5.5h29.1a4.1 4.1 0 003.9-5.5z"/>
      </svg>
      <span class="tb-brand-t">Azure</span>
      <span class="tb-brand-sub hide-xs">Console</span>
    </a>
    <div class="node-pick" id="nodePick">
      <button class="tb-host node-btn" id="nodeBtn" type="button" title="Switch target server">
        <i class="dot ok" id="nodeDot"></i>
        <svg class="ico sm"><use href="#i-server"/></svg>
        <b id="tbHost">—</b>
        <span class="node-sub hide-xs" id="tbNodeSub"></span>
        <svg class="ico sm node-chev"><use href="#i-chev"/></svg>
      </button>
      <div class="node-menu card hidden" id="nodeMenu"></div>
    </div>
    <span class="badge demo hidden" id="demoBadge">DEMO</span>
    <span class="tb-sp"></span>
    <span class="tb-stat mono hide-sm" id="tbLive">CPU — · RAM —</span>
    <span class="tb-stat mono hide-sm" id="tbUp">Uptime —</span>
    <span class="tb-stat mono hide-xs" id="tbClock">--:--:--</span>
    <a class="tb-btn" href="#/settings" title="Settings &amp; Passkeys" style="text-decoration:none"><svg class="ico"><use href="#i-gear"/></svg><span class="hide-sm">Settings</span></a>
    <button class="tb-btn" id="themeBtn" title="Toggle light / dark theme"><svg class="ico"><use href="#i-theme"/></svg></button>
    <button class="tb-btn" id="logoutBtn" title="Sign out"><svg class="ico"><use href="#i-logout"/></svg><span class="hide-sm">Sign out</span></button>
  </header>
  <div class="shell">
    <aside class="nav"><nav id="navList"></nav></aside>
    <div class="nav-scrim" id="navScrim"></div>
    <main class="main">
      <div id="nodeBanner" class="node-banner hidden"></div>
      <div class="page-head">
        <div class="crumbs-top"><a href="#/azure">Azure</a><span>›</span><span id="crumbNode">—</span><span>›</span><span id="crumbCur">—</span></div>
        <h1 id="pageTitle">—</h1>
        <p id="pageSub"></p>
      </div>
      <section id="view" class="view"></section>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts"></div>
